name: Build and Publish Package

on:
  push:
    tags:
      - 'v*'   # 只有打 tag 才會發佈到正式 PyPI
    branches:
      - 'pypi'
  workflow_dispatch:   # 手動觸發測試用

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install "setuptools<72.2.0"
        pip install --upgrade cibuildwheel==2.15.0 twine

    - name: Clean dist folder
      run: rm -rf dist
      shell: bash

    - name: Clean previous build artifacts
      run: |
        rm -rf build dist wpcsys/*.so wpcsys/*.c

    - name: Build wheels
      run: |
        cibuildwheel --output-dir dist

    - name: Check wheel metadata
      run: twine check dist/*

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheel-*
        path: dist
        merge-multiple: true   # 將所有 wheel 檔案放在 dist 目錄

    - name: Install Twine
      run: pip install --upgrade twine

    # 測試環境 (TestPyPI)
    - name: Upload to TestPyPI
      if: github.event_name == 'push' && github.ref == 'refs/heads/pypi'
      run: twine upload --repository testpypi dist/*.whl --verbose
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}

    # 正式環境 (PyPI)
    - name: Upload to PyPI
      if: startsWith(github.ref, 'refs/tags/v')
      run: twine upload dist/*.whl --verbose
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
